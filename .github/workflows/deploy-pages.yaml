name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "copilotkit-proxy/widget/**"
      - "frontend-direct-search/**"
      - ".github/workflows/deploy-pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            copilotkit-proxy/widget/package-lock.json
            frontend-direct-search/package-lock.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Verify widget runtime URL
        env:
          COPILOT_RUNTIME_URL: ${{ vars.COPILOT_RUNTIME_URL }}
          DIRECT_SEARCH_API_URL: ${{ vars.DIRECT_SEARCH_API_URL }}
        run: |
          test -n "$COPILOT_RUNTIME_URL" || { echo "Set the COPILOT_RUNTIME_URL repository variable before deploying Pages."; exit 1; }
          test -n "$DIRECT_SEARCH_API_URL" || { echo "Set the DIRECT_SEARCH_API_URL repository variable before deploying Pages."; exit 1; }
      - name: Build embeddable widget
        working-directory: copilotkit-proxy/widget
        env:
          VITE_COPILOT_RUNTIME_URL: ${{ vars.COPILOT_RUNTIME_URL }}
        run: |
          npm ci
          npm run build:widget
      - name: Build direct-search frontend
        working-directory: frontend-direct-search
        env:
          VITE_API_BASE_URL: ${{ vars.DIRECT_SEARCH_API_URL }}
        run: |
          npm ci
          npm run build
      - name: Assemble static site
        run: |
          mkdir -p _site/widget _site/direct-search
          cp docs/index.html _site/index.html
          cp docs/patron-ag-ui-a2a-copilotkit.md _site/patron-ag-ui-a2a-copilotkit.md
          cp docs/troubleshooting-github-pages.md _site/troubleshooting-github-pages.md
          cp -R copilotkit-proxy/widget/dist-widget/. _site/widget/
          cp -R frontend-direct-search/dist/. _site/direct-search/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
