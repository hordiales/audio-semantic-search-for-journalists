steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "${_IMAGE}"
      - -f
      - deploy/gcp/Dockerfile.search-service
      - .
    timeout: "1800s"
images:
  - "${_IMAGE}"
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE: "us-east1-docker.pkg.dev/example/audio-search-service:latest"
